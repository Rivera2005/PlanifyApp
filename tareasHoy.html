<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planify</title>
    <link rel="stylesheet" href="css/styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="img/calendario.png">
</head>

<body>
    <!--Menú-->
    <div class="container">
        <div class="menu">
            <nav>
                <ul>
                    <li id="perfil"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946429.png" alt=""
                            style="width: 25px; height: 25px; margin-right: 10px;">Luis</li>
                    <a>
                        <li id="iconoañadirTarea"><img src="https://cdn-icons-png.flaticon.com/512/15867/15867069.png"
                                alt="" style="width: 25px; height: 25px; margin-right: 10px;">Añadir tarea</li>
                    </a>
                    <li><img src="https://cdn-icons-png.flaticon.com/512/2319/2319177.png" alt=""
                            style="width: 25px; height: 25px; margin-right: 10px; opacity: 0.6;">Buscador</li>
                    <a href="bandejaEntrada.html">
                        <li><img src="https://cdn-icons-png.flaticon.com/512/736/736175.png " alt=""
                                style="width: 25px; height: 25px; margin-right: 10px; opacity: 0.6;">Bandeja de entrada
                        </li>
                    </a>
                    <a href="tareasHoy.html">
                        <li><img src="https://cdn-icons-png.flaticon.com/512/1827/1827444.png" alt=""
                                style="width: 25px; height: 25px; margin-right: 10px; opacity: 0.6;">Hoy</li>
                    </a>
                    <li><img src="https://cdn-icons-png.flaticon.com/512/3594/3594034.png" alt=""
                            style="width: 25px; height: 25px; margin-right: 10px; opacity: 0.6;">Próximo</li>
                    <a href="filtrosYEtiquetas.html">
                        <li><img src="https://cdn-icons-png.flaticon.com/512/4502/4502383.png" alt=""
                                style="width: 25px; height: 25px; margin-right: 10px; opacity: 0.6;">Filtros
                        </li>
                    </a>
                    <a href="tareasCompletadas.html">
                        <li><img src="https://cdn-icons-png.flaticon.com/512/1722/1722039.png" alt=""
                                style="width: 25px; height: 25px; margin-right: 10px; opacity: 0.6;">Tareas completadas
                        </li>
                    </a>
                    <a href="tareasVencidas.html">
                        <li><img src="https://cdn-icons-png.flaticon.com/512/9999/9999858.png" alt=""
                                style="width: 25px; height: 25px; margin-right: 10px; opacity: 0.6;">Tareas Vencidas
                        </li>
                    </a>
                    <li id="ayuda"><img src="https://cdn-icons-png.flaticon.com/512/3772/3772046.png " alt=""
                            style="width: 30px; height: 30px; margin-right: 10px; opacity: 0.6;">Ayuda y Recursos</li>
                </ul>

            </nav>
        </div>
        <div class="contenido-lateral">
            <!--Parte en que se muestran las tarea completadas-->
            <div class="divListaTareas" id="divListaTareas">
                <h1 id="h1bandejaEntrada">Hoy</h1>
                <ul id="listaTareasHoy">

                </ul>
            </div>
        </div>

        <!--Formulario para agregar una nueva tarea desde el menú-->
        <div class="modal" id="formulario-tareas-menu">
            <div class="formulario-tareas">
                <form action="">
                    <div class="grupo-texto">
                        <input type="text" placeholder="Nombre de la tarea" id="nombreTareaMenu">
                        <input type="text" placeholder="Descripción" id="descripcionTareaMenu">
                    </div>

                    <div class="grupo-opciones">
                        <input type="date" id="fechaTareaMenu" name="fecha" placeholder="Fecha">
                        <button type="button"><select id="opcionesFiltrosNuevaTareaMenu">
                                <option value="" disabled selected>🏳️ Prioridad</option>

                                <!--Aqui se mostraran los filtros creados-->
                            </select></button>
                        <button type="button">⏰ Recordatorios</button>
                        <button type="button">⋯</button>
                    </div>

                    <div class="grupo-final">
                        <select>
                            <option>Bandeja de entrada</option>
                        </select>
                        <div class="acciones">
                            <button type="button" class="cancelar"
                                id="desaparecerFormularioAñadirTareaMenu">Cancelar</button>
                            <button type="submit" class="añadir" id="nuevaTareaMenu">Añadir tarea</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
        <!--Formulario para editar una tarea tarea-->
        <div id="fondoOscuroEditar">
            <div class="formulario-tareas" id="formulario-tareas-editar">
                <form action="">
                    <div class="grupo-texto">
                        <input type="text" placeholder="Nombre de la tarea" id="nombreTareaEditar">
                        <input type="text" placeholder="Descripción" id="descripcionTareaEditar">
                    </div>
                    <div class="grupo-opciones">
                        <input type="date" name="fechaTareaEditar" id="fechaTareaEditar">
                        <button type="button"><select id="opcionesFiltrosEditar">
                                <option value="" disabled selected>🏳️ Prioridad</option>

                                <!--Aqui se mostraran los filtros creados-->
                            </select></button>
                        <button type="button">⏰ Recordatorios</button>
                        <button type="button">⋯</button>
                    </div>
                    <div class="grupo-final">
                        <select>
                            <option>Bandeja de entrada</option>
                        </select>
                        <div class="acciones">
                            <button type="button" class="cancelar" id="desaparecerFormularioEditar">Cancelar</button>
                            <button type="submit" class="añadir" id="guardarTarea">Guardar</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>

    </div>
    <script src="js/tareasHoy.js"></script>
</body>

</html>
