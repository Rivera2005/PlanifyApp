            <!--Parte en que se muestran las tarea-->
            <div class="divListaTareas">
                <h1 id="h1FiltrosyEtiquetas">Filtros</h1>
                <div style="display: flex; padding: 0px; padding-bottom: 5px; border-bottom: 1.5px solid #eeeeee;">

                    <h5 id="añadirfiltroaoculto" style="margin-left: auto;"><img
                            src="https://cdn-icons-png.flaticon.com/512/1828/1828921.png" alt=""
                            style="width: 10px; height: 10px; margin-right: 10px; opacity: 0.7;"></h5>
                </div>
                <ul id="listaFiltros">

                </ul>

            </div>
            <!--Formulario para crear un filtro-->
            <div class="modal" id="formularioAñadirFiltro">
                <div class="modal-contenido">
                    <span class="cerrar" id="cerrarModal">&times;</span>
                    <h3>Añadir filtro</h3>

                    <form id="formEtiqueta">
                        <!-- Nombre -->
                        <label for="nombreFiltro">Nombre</label>
                        <input type="text" id="nombreFiltro" class="NombreFiltro" maxlength="60"
                            placeholder="Introduce un nombre..." required>
                        <!-- Botones -->
                        <div class="acciones" id="accionesFiltros">
                            <button type="button" class="cancelar"
                                id="desaparecerFormularioNuevoFiltro">Cancelar</button>
                            <button type="submit" class="añadir" id="nuevoFiltro">Añadir</button>
                        </div>
                    </form>
                </div>
            </div>
            <!--Formulario para editar un filtro-->
            <div class="modal" id="formularioEditarFiltro">
                <div class="modal-contenido">
                    <span class="cerrar" id="cerrarModalEditando">&times;</span>
                    <h3>Editar filtro</h3>

                    <form id="formEtiqueta">
                        <!-- Nombre -->
                        <label for="nombreFiltroEditar">Nombre</label>
                        <input type="text" id="nombreFiltroEditar" class="NombreFiltro" maxlength="60"
                            placeholder="Introduce un nombre..." required>
                        <!-- Botones -->
                        <div class="acciones" id="accionesFiltros">
                            <button type="button" class="cancelar"
                                id="desaparecerFormularioEditarFiltro">Cancelar</button>
                            <button type="submit" class="añadir" id="guardarFiltro">Guardar</button>
                        </div>
                    </form>
                </div>
            </div>
            <!--Formulario de tarea desde el menú-->
            <div class="modal" id="formulario-tareas-menu">
                <div class="formulario-tareas">
                    <form action="">
                        <div class="grupo-texto">
                            <input type="text" placeholder="Nombre de la tarea" id="nombreTareaMenu">
                            <input type="text" placeholder="Descripción" id="descripcionTareaMenu">
                        </div>

                        <div class="grupo-opciones">
                            <input type="date" id="fechaTareaMenu" name="fecha" placeholder="Fecha">
                            <button type="button">⚑ Prioridad</button>
                            <button type="button">⏰ Recordatorios</button>
                            <button type="button">⋯</button>
                        </div>

                        <div class="grupo-final">
                            <select>
                                <option>Bandeja de entrada</option>
                            </select>
                            <div class="acciones">
                                <button type="button" class="cancelar"
                                    id="desaparecerFormularioAñadirTareaMenu">Cancelar</button>
                                <button type="submit" class="añadir" id="nuevaTareaMenu">Añadir tarea</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>


        </div>
